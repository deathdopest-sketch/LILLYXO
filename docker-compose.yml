# =============================================================================
# Lilly Bot v2.0 — Docker Compose
# Services: lilly-vita (NNN microservice on 8766) | lilly (bot on 7002)
# =============================================================================
services:

  # ── Lilly NNN v1.0.0 — Social Intelligence VITA Microservice ──────────────
  lilly-vita:
    build:
      context: ./vita_service
      dockerfile: Dockerfile.vita
    container_name: lilly-vita
    restart: unless-stopped
    ports:
      - "8766:8766"
    volumes:
      # vita.py runtime — read-only (shared with ZomB's Thanatos, separate mount)
      - "C:/Users/Death/Desktop/Vita Code language/vita:/vita:ro"
      # Lilly NNN model — read-only, separate mount (never nest under /vita)
      - "C:/Users/Death/Desktop/lilliv2.0/vita_models:/vita_models:ro"
    environment:
      - VITA_DIR=/vita
      - VITA_MODEL_PATH=/vita_models/lilly_nnn.vita
      - VITA_PORT=8766
    healthcheck:
      test: >
        python -c "import urllib.request;
        urllib.request.urlopen('http://localhost:8766/health')"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Lilly Bot v2.0 ────────────────────────────────────────────────────────
  lilly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lilly-bot
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "7002:7002"
    depends_on:
      lilly-vita:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOCKER=true
      # VITABridge uses this to talk to the NNN microservice
      - VITA_SERVICE_URL=http://lilly-vita:8766
      # Timezone — so _getTimeOfDayHint() reflects real local time
      - TZ=Australia/Sydney
      # Webcam video directory inside container
      - WEBCAM_DIR=/app/lilly_videos
    volumes:
      - ./Lilly_Data:/app/Lilly_Data
      # Webcam source videos — read-only mount from host
      - "C:/Users/Death/Desktop/DethAIepik/Lilly xo:/app/lilly_videos:ro"
    env_file:
      - .env
